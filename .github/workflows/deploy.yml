name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Build de produção
        run: npm run build

      # Fallback SPA: rotas como /noticias abrem o 404.html, que carrega o
      # mesmo JS e o react-router renderiza a rota correta.
      - name: Fallback SPA (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4